{% if page_obj.has_other_pages %}
<nav class="mt-3"><ul class="pagination pagination-sm mb-0">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">&laquo;</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} records)</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">&raquo;</a></li>{% endif %}
</ul></nav>
{% endif %}
