<form class="card card-body mb-3 py-2" method="get">
<div class="row g-2 align-items-end">
  <div class="col-md-3 col-lg-2"><label class="form-label small">Search</label><input class="form-control form-control-sm" name="q" value="{{ f.q }}" placeholder="Name, domain, e-mail"></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Continent</label><select class="form-select form-select-sm" name="continent"><option value="">All</option>{% for c in continents %}<option value="{{ c.code }}" {% if f.continent == c.code %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Country</label><select class="form-select form-select-sm" name="country"><option value="">All</option>{% for c in countries %}<option value="{{ c.iso2 }}" {% if f.country == c.iso2 %}selected{% endif %}>{{ c.name }} ({{ c.n }})</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Product interest</label><select class="form-select form-select-sm" name="product"><option value="">All</option>{% for p in products %}<option value="{{ p.pk }}" {% if f.product == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">OEM / Export</label><select class="form-select form-select-sm" name="business_type"><option value="">All</option>{% for v, l in business_types %}<option value="{{ v }}" {% if f.business_type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Lead quality</label><select class="form-select form-select-sm" name="oem_category"><option value="">All</option>{% for v, l in oem_categories %}<option value="{{ v }}" {% if f.oem_category == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  {% if not hide_stage %}<div class="col-md-3 col-lg-2"><label class="form-label small">Status</label><select class="form-select form-select-sm" name="stage"><option value="">All</option>{% for v, l in stages %}<option value="{{ v }}" {% if f.stage == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>{% endif %}
  <div class="col-md-3 col-lg-2"><label class="form-label small">Employee</label><select class="form-select form-select-sm" name="owner"><option value="">All</option><option value="none" {% if f.owner == 'none' %}selected{% endif %}>Unassigned</option>{% for u in owners %}<option value="{{ u.pk }}" {% if f.owner == u.pk|stringformat:"s" %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Quotation status</label><select class="form-select form-select-sm" name="quotation"><option value="">Any</option><option value="none" {% if f.quotation == 'none' %}selected{% endif %}>No quotation</option>{% for v, l in quotation_statuses %}<option value="{{ v }}" {% if f.quotation == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  <div class="col-md-3 col-lg-2"><label class="form-label small">Min. potential value</label><input class="form-control form-control-sm" name="min_value" value="{{ f.min_value }}" inputmode="decimal"></div>
  <div class="col-md-3 col-lg-2"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="followup_due" value="1" id="fd" {% if f.followup_due == '1' %}checked{% endif %}><label class="form-check-label small" for="fd">Follow-up due</label></div></div>
  <div class="col-md-3 col-lg-2 d-flex gap-1"><button class="btn btn-sm btn-primary flex-fill">Apply</button><a class="btn btn-sm btn-outline-secondary" href="?">Reset</a></div>
</div></form>
