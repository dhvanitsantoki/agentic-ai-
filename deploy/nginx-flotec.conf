# /etc/nginx/sites-available/flotec  (then: ln -s ../sites-available/flotec /etc/nginx/sites-enabled/)
# Obtain TLS certificates with:  certbot --nginx -d sales.yourdomain.com
server {
    listen 80;
    server_name sales.yourdomain.com;
    client_max_body_size 25m;

    location /static/ {
        alias /srv/flotec/app/staticfiles/;
        expires 30d;
        access_log off;
    }
    # /media/ is deliberately NOT served by nginx: Django serves uploads only to signed-in users.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
